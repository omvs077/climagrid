services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: climagrid
      POSTGRES_PASSWORD: climagrid
      POSTGRES_DB: climagrid
    ports:
      - "5433:5432"
    volumes:
      - climagrid_pgdata:/var/lib/postgresql/data

volumes:
  climagrid_pgdata:
